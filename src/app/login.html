<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <i class="pi pi-bolt login-logo"></i>
      <h2>GYM MANAGER</h2>
      <p>Inicie sesión para gestionar su gimnasio</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="field-group">
        <label for="email">Correo Electrónico</label>
        <input
          pInputText
          id="email"
          formControlName="email"
          type="email"
          placeholder="admin@gym.com"
          class="w-full"
        />
        <small
          class="p-error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        >
          Correo electrónico no válido
        </small>
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <input
          pInputText
          id="password"
          formControlName="password"
          type="password"
          placeholder="******"
          class="w-full"
        />
        <small
          class="p-error"
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        >
          Mínimo 6 caracteres
        </small>
      </div>

      <p-button
        label="Entrar al Panel"
        type="submit"
        [disabled]="loginForm.invalid"
        severity="success"
        styleClass="w-full mt-2"
        icon="pi pi-sign-in"
      >
      </p-button>
    </form>
    <div class="login-footer">Sistema de gestión deportiva v1.1</div>
  </div>
</div>
